<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="switch" role="radiogroup" aria-label="What to generate">
    <button type="button" role="radio" data-mode="passphrase">Passphrase</button>
    <button type="button" role="radio" data-mode="password">Password</button>
  </div>
  <output id="phrase" aria-live="polite"></output>
  <div class="actions">
    <div id="strength"><div class="bar"><span id="bar-fill"></span></div><span id="bits"></span></div>
    <button id="regen" class="icon" title="Generate another" aria-label="Generate another">↻</button>
    <button id="copy" class="primary">Copy</button>
  </div>

  <fieldset>
    <label id="preset-row" hidden>Preset
      <select id="preset"></select>
    </label>
    <div id="passphrase-opts" class="opts">
      <label>Words <strong id="count-val"></strong>
        <input type="range" id="count" min="3" max="12">
      </label>
      <div class="pair">
        <select id="sep" aria-label="Separator" title="Separator">
          <option value="-">Hyphen (-)</option>
          <option value=" ">Space</option>
          <option value=".">Period (.)</option>
          <option value="_">Underscore (_)</option>
          <option value="">No separator</option>
          <option value="custom">Custom…</option>
        </select>
        <input type="text" id="custom-sep" maxlength="5" placeholder="e.g. +" aria-label="Custom separator" hidden>
        <select id="caps" aria-label="Capitalization" title="Capitalization">
          <option value="none">lowercase</option>
          <option value="first">First Letter</option>
          <option value="upper">ALL CAPS</option>
          <option value="random">Random caps</option>
        </select>
      </div>
    </div>
    <div id="password-opts" class="opts">
      <label>Length <strong id="pw-length-val"></strong>
        <input type="range" id="pw-length" min="4" max="128">
      </label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="pw-upper"> A–Z</label>
        <label class="check"><input type="checkbox" id="pw-lower"> a–z</label>
        <label class="check"><input type="checkbox" id="pw-digits"> 0–9</label>
        <label class="check"><input type="checkbox" id="pw-symbols"> !@#</label>
      </div>
    </div>
  </fieldset>

  <div class="more">
    <span class="hint" id="extras"></span>
    <button id="customize" type="button" class="link">More options ↗</button>
  </div>
  <script src="wordlist.js"></script>
  <script src="generator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
